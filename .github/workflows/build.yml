# Builds the Windows executables and attaches them to a release.
#
# This workflow exists because PyInstaller is a bundler, not a cross-compiler.
# It wraps the interpreter and the compiled extension modules of the machine it
# runs on, so a Windows x64 binary has to be produced on Windows x64 and an
# ARM64 one on ARM64 Windows. Nobody can build these on a Mac, which is why they
# are built here instead.
#
# What comes out:
#
#   lares-x64.exe                terminal application, ~45 MB, fetches a model when it wants one
#   lares-desktop-x64.exe        desktop application, ~90 MB
#   lares-freehand-x64.exe       the no-catalogue lane: the model writes every fix
#   lares-full-x64.exe           terminal application with the 1.5B model inside it, ~1.1 GB
#   lares-freehand-full-x64.exe  the no-catalogue lane with the model inside it, ~1.1 GB
#   lares-arm64.exe              terminal application for Windows on ARM
#   lares-desktop-arm64.exe      desktop application for Windows on ARM
#   lares-freehand-arm64.exe     the no-catalogue lane for Windows on ARM
#
#   lares-full-arm64.exe           the same, for ARM - only when the backend compiles
#   lares-freehand-full-arm64.exe  and the same for the freehand lane
#
# llama-cpp-python publishes no ARM64 wheel, so the ARM64 job tries to compile
# one. llama.cpp refuses to build with MSVC on ARM ("use clang"), so the build
# goes through clang-cl. It is allowed to fail: the slim ARM64 build ships
# either way, and the application is honest about which one you have.
#
# Windows 11 on ARM also runs x64 binaries under emulation, so lares-full-x64.exe
# works on an ARM machine today - slower, but with the model.

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      embed_model:
        description: "Also build the large single file with the model inside it"
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  MODEL_REPO: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
  MODEL_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf

jobs:
  # ------------------------------------------------------------------------
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt -r requirements-gui.txt pytest
      - name: Run the suite on the platform it targets
        run: python -m pytest tests/ -q

  # ------------------------------------------------------------------------
  x64:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-gui.txt pyinstaller
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
        shell: pwsh

      - name: Confirm the model backend is really present
        run: python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"

      - name: Build
        run: pyinstaller winbuild/lares.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the built executables
        shell: pwsh
        run: |
          # A binary that cannot load its own catalogue is not worth shipping,
          # and that is exactly the failure a bad spec produces.
          ./dist/lares.exe --version
          ./dist/lares.exe --plain doctor
          ./dist/lares.exe --plain --demo scan | Select-Object -First 20
          if (-not (Test-Path ./dist/lares-desktop.exe)) { throw "desktop build missing" }

          # The survey reads this runner for real - it is read-only, so there
          # is nothing to undo, and it is the only place the six PowerShell
          # collectors meet an actual Windows before a user does. A syntax
          # error in one of them looks like "could not be read" rather than a
          # crash, so the check is that every view came back.
          $surface = ./dist/lares.exe --plain surface --json | Out-String
          $parsed = $surface | ConvertFrom-Json
          $broken = $parsed.sections | Where-Object { $_.error }
          if ($broken) {
            $broken | ForEach-Object { Write-Host "$($_.key): $($_.error)" }
            throw "a surface collector could not read this machine"
          }
          Write-Host "all $($parsed.sections.Count) readings came back"
          if (-not ($parsed.sections | Where-Object { $_.key -eq "ports" }).rows) {
            throw "nothing is listening on this machine, which cannot be true"
          }

          # The freehand binary is the one that claims to carry no catalogue,
          # so the smoke test checks the claim rather than restating it: the
          # recorded walkthrough exercises every stage of the lane without a
          # model, and the binary must not be able to read a control.
          ./dist/lares-freehand.exe --version
          $walk = ./dist/lares-freehand.exe --plain --demo --recorded --pace 0 --budget 2 | Out-String
          if ($walk -notmatch "the code the model wrote") { Write-Host $walk; throw "freehand walkthrough did not run" }
          if ($walk -notmatch "REACHABLE FROM THE NETWORK") { Write-Host $walk; throw "freehand read no ports" }
          if ($walk -match "NET-005|IDN-001|SVC-003") { Write-Host $walk; throw "the freehand build is carrying catalogue controls" }

      - name: Name them for the release
        shell: pwsh
        run: |
          Copy-Item dist/lares.exe dist/lares-x64.exe
          Copy-Item dist/lares-desktop.exe dist/lares-desktop-x64.exe
          Copy-Item dist/lares-freehand.exe dist/lares-freehand-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lares-x64
          path: |
            dist/lares-x64.exe
            dist/lares-desktop-x64.exe
            dist/lares-freehand-x64.exe

      # -- the single file with the model inside it -----------------------
      - name: Fetch the model
        if: github.event_name == 'push' || inputs.embed_model
        shell: pwsh
        run: |
          $url = "https://huggingface.co/$env:MODEL_REPO/resolve/main/$env:MODEL_FILE"
          Write-Host "Downloading $url"
          # Keep the upstream filename. It is recorded in the executable's
          # footer and becomes the name of the unpacked file, and it is what
          # lets the application match the payload to its ladder entry - so
          # "model.gguf" would cost the real name, context length and speed
          # estimate on the Model page.
          curl.exe -L --fail --retry 3 -o $env:MODEL_FILE $url
          "{0:N0} MB" -f ((Get-Item $env:MODEL_FILE).Length / 1MB)

      - name: Embed it
        if: github.event_name == 'push' || inputs.embed_model
        shell: pwsh
        run: |
          python winbuild/embed_model.py dist/lares.exe $env:MODEL_FILE --output dist/lares-full-x64.exe
          python winbuild/embed_model.py --check dist/lares-full-x64.exe

          # The freehand lane needs the model more than any other build does:
          # without one it has nothing to fall back on and refuses to run at
          # all, which makes the single file that carries it the only form of
          # that program most people should want.
          python winbuild/embed_model.py dist/lares-freehand.exe $env:MODEL_FILE --output dist/lares-freehand-full-x64.exe
          python winbuild/embed_model.py --check dist/lares-freehand-full-x64.exe

      - name: Prove the single file actually works
        if: github.event_name == 'push' || inputs.embed_model
        shell: pwsh
        run: |
          # Unpacks the model on first run, verifies its hash, and reports it.
          # If the overlay were wrong this is where it would surface.
          ./dist/lares-full-x64.exe --plain doctor
          ./dist/lares-full-x64.exe --plain model

          # And the part that a passing "doctor" did not previously guarantee:
          # that the bundled backend actually imports. It is pure Python around
          # a native library, so the package can be present and still fail to
          # load, which is how a build once reported the backend installed and
          # missing in the same run.
          $report = ./dist/lares-full-x64.exe --plain doctor | Out-String
          if ($report -notmatch "llama-cpp-python is installed and loads") {
            Write-Host $report
            throw "the bundled model backend does not load in the built executable"
          }
          Write-Host "the bundled backend loads"

          # And the freehand single file, which is the one that cannot work
          # without it. "no model here" is its one refusal, so a build that
          # says that is a build nobody can use.
          # What is being tested here is that the binary finds the model
          # inside itself. Whether a 1.5B model then produces a usable
          # assessment of a synthetic machine is a separate question with a
          # legitimate "no" - so the program's own exit code is read and
          # cleared rather than being allowed to fail the step, and the output
          # is printed either way, because a check that hides the thing it
          # just checked cannot be debugged when it goes wrong.
          $fh = ./dist/lares-freehand-full-x64.exe --plain --demo --dry-run --budget 1 2>&1 | Out-String
          $ran = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Write-Host $fh
          Write-Host "lares-freehand-full-x64.exe exited $ran"
          if ($fh -match "there is no model here") {
            throw "the freehand single file cannot see its own embedded model"
          }
          if ($fh -notmatch "what is on this machine") {
            throw "the freehand single file did not get as far as reading the machine"
          }
          # Deterministic, and about this repository rather than about the
          # model's judgement: llama.cpp refuses a grammar whose repetitions it
          # considers excessive, the engine then generates unconstrained, and
          # the visible symptom is "the model wrote none" three steps later.
          if ($fh -match "error parsing grammar") {
            throw "llama.cpp refused the schema grammar - a maxLength is too large"
          }
          Write-Host "the freehand single file finds its model"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.embed_model
        with:
          name: lares-full-x64
          path: |
            dist/lares-full-x64.exe
            dist/lares-freehand-full-x64.exe
          compression-level: 0     # a Q4 GGUF does not compress; skip the hour

  # ------------------------------------------------------------------------
  arm64:
    needs: test
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Install
        run: pip install -r requirements.txt -r requirements-gui.txt pyinstaller

      # llama-cpp-python publishes no ARM64 wheel, so the only way an ARM64
      # user gets the model is if it is compiled here. The runner image carries
      # Visual Studio 2022 with Microsoft.VisualStudio.Component.VC.Tools.ARM64
      # and CMake, which is exactly what that needs.
      #
      # It is allowed to fail. A source build of llama.cpp has a great many ways
      # to go wrong on a platform its authors do not ship binaries for, and the
      # right outcome then is the slim ARM64 build that already worked rather
      # than no release at all. Every later step asks whether it succeeded.
      - name: Try to compile the model backend for ARM64
        id: backend
        continue-on-error: true
        shell: pwsh
        run: |
          # Two things had to be learned the hard way here.
          #
          # First, only llama-cpp-python may be forced to build from source.
          # ":all:" applies that to every dependency, which drags in numpy,
          # which needs Cython, which fails on MSVC ARM64 with a C1083 on a
          # compiler-generated file - so llama.cpp was never even reached.
          #
          # Second, llama.cpp's own CMake refuses this outright:
          #   "MSVC is not supported for ARM, use clang"
          # so the default MSVC toolset cannot build it at all. The image
          # carries LLVM and Ninja, so clang-cl is used instead.
          $common = "-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CCACHE=OFF"

          Write-Host "=== attempt 1: Visual Studio generator with the ClangCL toolset ==="
          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
          $env:CMAKE_GENERATOR_TOOLSET = "ClangCL"
          $env:CMAKE_GENERATOR_PLATFORM = "ARM64"
          $env:CMAKE_ARGS = $common
          pip install --no-binary llama-cpp-python llama-cpp-python
          if ($LASTEXITCODE -eq 0) {
            python -c "import llama_cpp; print('built llama_cpp', llama_cpp.__version__)"
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }

          Write-Host "=== attempt 2: Ninja driving clang-cl directly ==="
          Remove-Item Env:CMAKE_GENERATOR_TOOLSET, Env:CMAKE_GENERATOR_PLATFORM -ErrorAction SilentlyContinue
          $env:CMAKE_GENERATOR = "Ninja"
          $env:CMAKE_ARGS = "$common -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl"
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch arm64 -HostArch arm64 -SkipAutomaticLocation
          pip install --no-binary llama-cpp-python llama-cpp-python
          python -c "import llama_cpp; print('built llama_cpp', llama_cpp.__version__)"

      - name: Say which kind of ARM64 build this is
        shell: pwsh
        run: |
          $built = "${{ steps.backend.outcome }}" -eq "success"
          Write-Host "model backend compiled: $built"
          "HAS_BACKEND=$($built.ToString().ToLower())" | Out-File $env:GITHUB_ENV -Append

      - name: Build
        run: pyinstaller winbuild/lares.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test
        shell: pwsh
        run: |
          ./dist/lares.exe --version
          ./dist/lares.exe --plain doctor
          ./dist/lares.exe --plain --demo scan | Select-Object -First 20

          ./dist/lares-freehand.exe --version
          $walk = ./dist/lares-freehand.exe --plain --demo --recorded --pace 0 --budget 2 | Out-String
          if ($walk -notmatch "the code the model wrote") { Write-Host $walk; throw "freehand walkthrough did not run" }
          if ($walk -match "NET-005|IDN-001|SVC-003") { Write-Host $walk; throw "the freehand build is carrying catalogue controls" }

      - name: Name them for the release
        shell: pwsh
        run: |
          Copy-Item dist/lares.exe dist/lares-arm64.exe
          Copy-Item dist/lares-desktop.exe dist/lares-desktop-arm64.exe
          Copy-Item dist/lares-freehand.exe dist/lares-freehand-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lares-arm64
          path: |
            dist/lares-arm64.exe
            dist/lares-desktop-arm64.exe
            dist/lares-freehand-arm64.exe

      # -- the single file with the model inside it, for ARM64 ------------
      - name: Fetch the model
        if: env.HAS_BACKEND == 'true'
        shell: pwsh
        run: |
          $url = "https://huggingface.co/$env:MODEL_REPO/resolve/main/$env:MODEL_FILE"
          curl.exe -L --fail --retry 3 -o $env:MODEL_FILE $url
          "{0:N0} MB" -f ((Get-Item $env:MODEL_FILE).Length / 1MB)

      - name: Embed it
        if: env.HAS_BACKEND == 'true'
        shell: pwsh
        run: |
          python winbuild/embed_model.py dist/lares.exe $env:MODEL_FILE --output dist/lares-full-arm64.exe
          python winbuild/embed_model.py --check dist/lares-full-arm64.exe

          python winbuild/embed_model.py dist/lares-freehand.exe $env:MODEL_FILE --output dist/lares-freehand-full-arm64.exe
          python winbuild/embed_model.py --check dist/lares-freehand-full-arm64.exe

      - name: Prove the ARM64 single file actually loads its model
        if: env.HAS_BACKEND == 'true'
        shell: pwsh
        run: |
          ./dist/lares-full-arm64.exe --plain doctor
          ./dist/lares-full-arm64.exe --plain model

          $report = ./dist/lares-full-arm64.exe --plain doctor | Out-String
          if ($report -notmatch "llama-cpp-python is installed and loads") {
            Write-Host $report
            throw "the bundled ARM64 model backend does not load"
          }
          Write-Host "the bundled ARM64 backend loads"

          # What is being tested here is that the binary finds the model
          # inside itself. Whether a 1.5B model then produces a usable
          # assessment of a synthetic machine is a separate question with a
          # legitimate "no" - so the program's own exit code is read and
          # cleared rather than being allowed to fail the step, and the output
          # is printed either way, because a check that hides the thing it
          # just checked cannot be debugged when it goes wrong.
          $fh = ./dist/lares-freehand-full-arm64.exe --plain --demo --dry-run --budget 1 2>&1 | Out-String
          $ran = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          Write-Host $fh
          Write-Host "lares-freehand-full-arm64.exe exited $ran"
          if ($fh -match "there is no model here") {
            throw "the freehand ARM64 single file cannot see its own embedded model"
          }
          if ($fh -notmatch "what is on this machine") {
            throw "the freehand ARM64 single file did not get as far as reading the machine"
          }
          # Deterministic, and about this repository rather than about the
          # model's judgement: llama.cpp refuses a grammar whose repetitions it
          # considers excessive, the engine then generates unconstrained, and
          # the visible symptom is "the model wrote none" three steps later.
          if ($fh -match "error parsing grammar") {
            throw "llama.cpp refused the schema grammar - a maxLength is too large"
          }
          Write-Host "the freehand ARM64 single file finds its model"

      - uses: actions/upload-artifact@v4
        if: env.HAS_BACKEND == 'true'
        with:
          name: lares-full-arm64
          path: |
            dist/lares-full-arm64.exe
            dist/lares-freehand-full-arm64.exe
          compression-level: 0

  # ------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [x64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -name '*.exe' -exec cp {} release/ \;
          cd release
          sha256sum *.exe | tee SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: .github/RELEASE_NOTES.md
          # Without this the action leaves an existing release's body alone,
          # so a re-run of a tag silently keeps whatever was there before.
          append_body: false
          name: Lares ${{ github.ref_name }}

  # ------------------------------------------------------------------------
  # Prove the thing people will actually do works.
  #
  # Building an executable and publishing it is not the same as someone being
  # able to install and run it. This job does exactly what a user does - runs
  # install.ps1 against the release that was just published, on a clean machine
  # of each architecture - and fails the run if any part of that does not work.
  verify-install:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: The installer must at least parse
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            throw "install.ps1 has $($errors.Count) parse error(s)"
          }
          Write-Host "install.ps1 parses clean"

      - name: Dry run
        shell: pwsh
        run: ./install.ps1 -Version ${{ github.ref_name }} -WhatIf

      - name: Install it the way a person would
        shell: pwsh
        run: ./install.ps1 -Version ${{ github.ref_name }} -Desktop -Freehand

      - name: The installed command must work
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Lares"
          $exe = "$dir\lares.exe"
          if (-not (Test-Path $exe)) { throw "lares.exe was not installed" }
          if (-not (Test-Path "$dir\lares-desktop.exe")) {
            throw "lares-desktop.exe was not installed"
          }
          & $exe --version
          & $exe --plain doctor
          & $exe --plain --demo scan | Select-Object -First 15
          & $exe --plain --demo run  | Select-Object -First 15
          & $exe --plain logs -n 5

      - name: And so must the freehand program
        shell: pwsh
        run: |
          # The naming here is the part worth testing rather than asserting:
          # lares-freehand-full-x64.exe matches the pattern for the ordinary
          # full build too, so getting the order of those tests wrong installs
          # the freehand binary over the top of lares.exe and nobody notices
          # until the wrong program starts.
          $dir = "$env:LOCALAPPDATA\Programs\Lares"
          $fh = "$dir\lares-freehand.exe"
          if (-not (Test-Path $fh)) { throw "lares-freehand.exe was not installed" }
          & $fh --version
          $walk = & $fh --plain --demo --recorded --pace 0 --budget 2 | Out-String
          if ($walk -notmatch "the code the model wrote") {
            Write-Host $walk
            throw "the freehand walkthrough did not run"
          }
          if ((& $dir\lares.exe --version | Out-String) -notmatch "^Lares \d") {
            throw "lares.exe was overwritten by another program"
          }
          Write-Host "both programs are installed and are different programs"

      - name: The PATH entry must survive with its variables intact
        shell: pwsh
        run: |
          # The bug this guards against: reading the user PATH with
          # [Environment]::GetEnvironmentVariable expands %USERPROFILE% and
          # friends, and writing the expanded string back destroys every
          # variable reference permanently. Assert the entry was added and
          # that nothing else was flattened.
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Environment")
          $raw = $key.GetValue("Path", "",
            [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.Dispose()
          Write-Host "user PATH: $raw"
          if ($raw -notlike "*Programs\Lares*") { throw "install directory is not on the PATH" }
          Write-Host "PATH entry present"

      - name: Installing twice must be safe
        shell: pwsh
        run: |
          ./install.ps1 -Version ${{ github.ref_name }}
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Environment")
          $raw = $key.GetValue("Path", "",
            [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.Dispose()
          $count = ([regex]::Matches($raw, [regex]::Escape("Programs\Lares"))).Count
          if ($count -ne 1) { throw "PATH gained $count copies of the install directory" }
          Write-Host "second run added no duplicate"
